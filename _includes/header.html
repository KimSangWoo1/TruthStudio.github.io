<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="TruthStudio home">
      <span class="brand-mark" aria-hidden="true">T</span>
      <span>Truth<span>Studio</span></span>
    </a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">메뉴 열기</span>
      <span></span><span></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="주요 메뉴">
      {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
      <a class="nav-github" href="https://github.com/KimSangWoo1" target="_blank" rel="noreferrer">GitHub ↗</a>
    </nav>
  </div>
</header>
